name: StudyForge
options:
  bundleIdPrefix: com.scenio.mth
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 8
    MARKETING_VERSION: 0.7.0
    INFOPLIST_KEY_CFBundleDisplayName: Study Frog
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  StudyForge:
    type: application
    platform: iOS
    sources:
      - StudyForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scenio.mth
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: StudyForge/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Connect to your own computer engine only when you request local image or motion-video generation.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - framework: NativeBuild/sf_engine.framework
        embed: true
  StudyForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StudyForgeTests
    dependencies:
      - target: StudyForge
schemes:
  StudyForge:
    build:
      targets:
        StudyForge: all
    test:
      targets:
        - StudyForgeTests
