name: Study Frog Android emulator checks
'on':
  push:
    branches:
    - main
    paths:
    - app/**
    - shared/**
    - gradle/**
    - gradlew
    - gradlew.bat
    - '*.gradle.kts'
    - gradle.properties
    - .github/workflows/android-device.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: android-test-updates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - uses: gradle/actions/setup-gradle@v4
    - name: Enable emulator acceleration
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"''
        | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Install native build toolchain
      run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
        'cmake;3.22.1'
    - name: Run Room, WorkManager, Compose and editable-backup tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        script: ./gradlew --no-daemon connectedDebugAndroidTest -PfirebaseEnabled=false
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: device-test-reports
        path: 'app/build/reports/androidTests/

          app/build/outputs/androidTest-results/

          '
        if-no-files-found: ignore
