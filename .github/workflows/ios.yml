name: Study Frog iOS simulator
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'shared/**'
      - 'scripts/build-ios-native.sh'
      - '.github/workflows/ios.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build shared offline inference framework
        run: bash scripts/build-ios-native.sh
      - name: Obtain pinned free XcodeGen
        run: |
          curl -fL --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          generator=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen | head -n 1)
          chmod +x "$generator"
          "$generator" generate --spec ios/project.yml
      - name: Build and test iOS simulator app
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcodebuild -project ios/StudyForge.xcodeproj -scheme StudyForge -destination "platform=iOS Simulator,id=$device" -derivedDataPath build/ios-derived -resultBundlePath build/ios-tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studyforge-ios-simulator
          retention-days: 7
          path: |
            build/ios-derived/Build/Products/Debug-iphonesimulator/StudyForge.app
            build/ios-tests.xcresult
          if-no-files-found: ignore
